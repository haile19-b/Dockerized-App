name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Verify Docker Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Environment
        run: |
          cp .env.example .env
          echo "Configured environment file from .env.example"

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build and Start Containers
        run: docker compose up --build -d

      - name: Wait for Database and Services
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            if curl -s -f http://localhost:5001/api/health > /dev/null; then
              echo "Backend and Database are healthy!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 2
          done

      - name: Verify Running Containers
        run: docker compose ps

      - name: Test Backend Health Endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:5001/api/health)
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"'
          echo "$RESPONSE" | grep -q '"database":"connected"'

      - name: Test Chat API Endpoint
        run: |
          CHAT_RES=$(curl -s -X POST http://localhost:5001/api/chat \
            -H "Content-Type: application/json" \
            -d '{"message": "Hello from CI pipeline"}')
          echo "Chat response: $CHAT_RES"
          echo "$CHAT_RES" | grep -q 'userMessage'

      - name: Test Message History Retrieval
        run: |
          MESSAGES=$(curl -s http://localhost:5001/api/messages)
          echo "Messages: $MESSAGES"
          echo "$MESSAGES" | grep -q 'Hello from CI pipeline'

      - name: Test Frontend HTTP Status
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001)
          echo "Frontend returned HTTP status: $HTTP_STATUS"
          [ "$HTTP_STATUS" -eq 200 ]

      - name: Display Container Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Tear Down Services
        if: always()
        run: docker compose down -v
